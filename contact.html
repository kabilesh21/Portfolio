<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact Kabilesh M. Get in touch via email, phone, LinkedIn, GitHub, or send a message directly using the contact form.">
    <title>Contact Me | Kabilesh M</title>
    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Page Transition Overlay -->
    <div class="page-transition-overlay" id="page-overlay"></div>

    <!-- Navigation Header -->
    <header class="header" id="header">
        <div class="container">
            <a href="index.html" class="logo">
                KABILESH M<span class="logo-dot"></span>
            </a>
            
            <nav class="nav-menu" id="nav-menu">
                <a href="index.html" class="nav-link">Home</a>
                <a href="about.html" class="nav-link">About</a>
                <a href="contact.html" class="nav-link active">Contact</a>
            </nav>

            <button class="hamburger" id="hamburger" aria-label="Toggle navigation menu">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="section" style="padding-top: calc(var(--header-height) + 40px);">
        <div class="container">
            <div class="section-header reveal">
                <span class="section-tag">Get In Touch</span>
                <h1 class="section-title">Contact Me</h1>
            </div>

            <div class="contact-grid">
                <!-- Left: Contact Details -->
                <div class="contact-info-panel reveal">
                    <!-- Email Card -->
                    <div class="card contact-info-card">
                        <div class="contact-info-icon">
                            <i class="fa-solid fa-envelope"></i>
                        </div>
                        <div class="contact-info-details">
                            <h4>Email</h4>
                            <p><a href="mailto:kabileshclg0678@gmail.com">kabileshclg0678@gmail.com</a></p>
                        </div>
                    </div>

                    <!-- Phone Card -->
                    <div class="card contact-info-card">
                        <div class="contact-info-icon">
                            <i class="fa-solid fa-phone"></i>
                        </div>
                        <div class="contact-info-details">
                            <h4>Phone</h4>
                            <p><a href="tel:+916385496979">+91 6385496979</a></p>
                        </div>
                    </div>

                    <!-- Social / Dev Profiles Card -->
                    <div class="card contact-info-card" style="display: block;">
                        <h4 style="font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-secondary); margin-bottom: 15px;">Professional Profiles</h4>
                        <div class="btn-group" style="gap: 10px;">
                            <a href="https://linkedin.com/in/kabilesh-m-185a21377" target="_blank" class="btn btn-secondary" style="padding: 10px 20px; font-size: 0.85rem;" rel="noopener noreferrer">
                                <i class="fa-brands fa-linkedin" style="color: #0077b5;"></i> LinkedIn
                            </a>
                            <a href="https://github.com/kabilesh21" target="_blank" class="btn btn-secondary" style="padding: 10px 20px; font-size: 0.85rem;" rel="noopener noreferrer">
                                <i class="fa-brands fa-github"></i> GitHub
                            </a>
                            <a href="https://leetcode.com/u/kabi_lesh_678/" target="_blank" class="btn btn-secondary" style="padding: 10px 20px; font-size: 0.85rem;" rel="noopener noreferrer">
                                <i class="fa-solid fa-code" style="color: #ffa116;"></i> LeetCode
                            </a>
                        </div>
                    </div>
                </div>

                <!-- Right: Contact Form -->
                <div class="card contact-form-card reveal delay-150">
                    <h3 class="form-title">Send a Message</h3>
                    
                    <form id="contact-form">
                        <div class="form-group row">
                            <div>
                                <label for="name" class="form-label">Full Name</label>
                                <input type="text" id="name" class="form-control" placeholder="John Doe" required>
                            </div>
                            <div>
                                <label for="email" class="form-label">Email Address</label>
                                <input type="email" id="email" class="form-control" placeholder="john@example.com" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="subject" class="form-label">Subject</label>
                            <input type="text" id="subject" class="form-control" placeholder="Job Offer / Internship / Project inquiry" required>
                        </div>

                        <div class="form-group">
                            <label for="message" class="form-label">Message</label>
                            <textarea id="message" class="form-control" placeholder="Your message here..." required></textarea>
                        </div>

                        <button type="submit" class="btn btn-primary" style="width: 100%;">
                            Submit Message <i class="fa-solid fa-paper-plane"></i>
                        </button>

                        <div id="form-status" class="form-status"></div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-logo">KABILESH M<span class="logo-dot"></span></div>
            <div class="footer-copy">
                &copy; <span id="current-year">2026</span>. Made by KABILESH M. All rights reserved.
            </div>
        </div>
    </footer>

    <!-- Back to Top -->
    <a href="#" class="back-to-top" id="back-to-top" aria-label="Back to Top">
        <i class="fa-solid fa-chevron-up"></i>
    </a>

    <!-- Custom JS -->
    <script src="script.js"></script>
</body>
</html>
